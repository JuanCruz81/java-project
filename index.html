<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor de Tareas</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            width: 100%;
            padding: 40px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #333;
            font-size: 28px;
            margin-bottom: 10px;
        }

        .header p {
            color: #999;
            font-size: 14px;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 20px;
            padding: 12px;
            background: #f5f5f5;
            border-radius: 8px;
            font-size: 14px;
        }

        .status-indicator {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #ff6b6b;
        }

        .status-indicator.connected {
            background: #51cf66;
        }

        .status-indicator.loading {
            background: #ffd43b;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        button {
            flex: 1;
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #333;
        }

        .btn-secondary:hover {
            background: #e0e0e0;
        }

        .tasks-list {
            max-height: 400px;
            overflow-y: auto;
        }

        .task-item {
            background: #f9f9f9;
            border-left: 4px solid #667eea;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 6px;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .task-item.completed {
            border-left-color: #51cf66;
            opacity: 0.7;
        }

        .task-title {
            font-weight: 600;
            color: #333;
            margin-bottom: 5px;
        }

        .task-completed .task-title {
            text-decoration: line-through;
            color: #999;
        }

        .task-meta {
            font-size: 12px;
            color: #999;
            display: flex;
            gap: 15px;
        }

        .task-id {
            font-family: 'Courier New', monospace;
            background: #e8e8e8;
            padding: 2px 6px;
            border-radius: 3px;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #999;
        }

        .empty-state svg {
            width: 60px;
            height: 60px;
            margin-bottom: 15px;
            opacity: 0.3;
        }

        .error {
            background: #ffe0e0;
            color: #c00;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 4px solid #c00;
        }

        .success {
            background: #e0ffe0;
            color: #0a0;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 4px solid #0a0;
        }

        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #eee;
        }

        .stat {
            text-align: center;
            padding: 10px;
        }

        .stat-number {
            font-size: 24px;
            font-weight: bold;
            color: #667eea;
        }

        .stat-label {
            font-size: 12px;
            color: #999;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📋 Gestor de Tareas</h1>
            <p>Cliente Web para tu API Java</p>
        </div>

        <div class="status">
            <div class="status-indicator" id="statusIndicator"></div>
            <span id="statusText">Desconectado</span>
        </div>

        <div id="messageContainer"></div>

        <div class="controls">
            <button class="btn-primary" id="loadBtn">🔄 Cargar Tareas</button>
            <button class="btn-secondary" id="clearBtn">🗑️ Limpiar</button>
        </div>

        <div id="tasksList" class="tasks-list">
            <div class="empty-state">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
                <p>Haz clic en "Cargar Tareas" para comenzar</p>
            </div>
        </div>

        <div class="stats">
            <div class="stat">
                <div class="stat-number" id="totalTasks">0</div>
                <div class="stat-label">Total</div>
            </div>
            <div class="stat">
                <div class="stat-number" id="completedTasks">0</div>
                <div class="stat-label">Completadas</div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:8080/api/tasks';
        const tasksList = document.getElementById('tasksList');
        const loadBtn = document.getElementById('loadBtn');
        const clearBtn = document.getElementById('clearBtn');
        const statusIndicator = document.getElementById('statusIndicator');
        const statusText = document.getElementById('statusText');
        const messageContainer = document.getElementById('messageContainer');
        const totalTasksEl = document.getElementById('totalTasks');
        const completedTasksEl = document.getElementById('completedTasks');

        let tasks = [];

        // Cargar tareas
        loadBtn.addEventListener('click', loadTasks);
        clearBtn.addEventListener('click', clearTasks);

        async function loadTasks() {
            loadBtn.disabled = true;
            messageContainer.innerHTML = '';
            statusIndicator.className = 'status-indicator loading';
            statusText.textContent = 'Cargando...';

            try {
                const response = await fetch(API_URL, {
                    method: 'GET',
                    headers: {
                        'Accept': 'application/json',
                        'Content-Type': 'application/json'
                    }
                });

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }

                tasks = await response.json();
                displayTasks();
                showMessage('✅ Tareas cargadas correctamente', 'success');
                updateStatus(true);
            } catch (error) {
                console.error('Error:', error);
                showMessage(`❌ Error: ${error.message}`, 'error');
                updateStatus(false);
            } finally {
                loadBtn.disabled = false;
            }
        }

        function displayTasks() {
            if (!tasks || tasks.length === 0) {
                tasksList.innerHTML = `
                    <div class="empty-state">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
                        </svg>
                        <p>No hay tareas disponibles</p>
                    </div>
                `;
                updateStats(0, 0);
                return;
            }

            const completedCount = tasks.filter(t => t.completed).length;
            updateStats(tasks.length, completedCount);

            tasksList.innerHTML = tasks.map((task, index) => `
                <div class="task-item ${task.completed ? 'completed task-completed' : ''}">
                    <div class="task-title">${escapeHtml(task.title || `Tarea #${index + 1}`)}</div>
                    <div class="task-meta">
                        <span class="task-id">ID: ${task.id || 'N/A'}</span>
                        <span>Estado: ${task.completed ? '✅ Completada' : '⏳ Pendiente'}</span>
                    </div>
                    ${task.description ? `<div style="margin-top: 8px; font-size: 13px; color: #666;">${escapeHtml(task.description)}</div>` : ''}
                </div>
            `).join('');
        }

        function updateStats(total, completed) {
            totalTasksEl.textContent = total;
            completedTasksEl.textContent = completed;
        }

        function clearTasks() {
            tasks = [];
            tasksList.innerHTML = `
                <div class="empty-state">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                    <p>Haz clic en "Cargar Tareas" para comenzar</p>
                </div>
            `;
            updateStats(0, 0);
            messageContainer.innerHTML = '';
        }

        function showMessage(message, type) {
            messageContainer.innerHTML = `<div class="${type}">${message}</div>`;
        }

        function updateStatus(connected) {
            if (connected) {
                statusIndicator.className = 'status-indicator connected';
                statusText.textContent = 'Conectado a API';
            } else {
                statusIndicator.className = 'status-indicator';
                statusText.textContent = 'Error de conexión';
            }
        }

        function escapeHtml(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text.replace(/[&<>"']/g, m => map[m]);
        }

        // Verificar conexión al cargar
        window.addEventListener('load', () => {
            console.log('🚀 Cliente Web de Tareas cargado');
            console.log('📡 Conectando a:', API_URL);
        });
    </script>
</body>
</html>
