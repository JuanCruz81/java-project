name: Build & Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up JDK 11
      uses: actions/setup-java@v3
      with:
        java-version: '11'
        distribution: 'adopt'
        cache: maven

    - name: Build with Maven
      run: mvn clean compile

    - name: Run tests
      run: mvn test

    - name: Package JAR
      run: mvn package -DskipTests

    - name: Upload artifact
      uses: actions/upload-artifact@v3
      with:
        name: java-http-client-jar
        path: target/java-http-client-*.jar

    - name: Print build info
      run: |
        echo "✅ Build completed successfully!"
        echo "📦 Artifact location: target/java-http-client-*.jar"
        ls -lh target/*.jar 2>/dev/null || echo "No JAR file found"
